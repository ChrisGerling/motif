<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOTIF — under construction</title>
<style>
  :root{ --bg:#eaeff7; --ink:#2b3445; --soft:#4a5468; --muted:#7b869a; }
  *{ box-sizing:border-box }
  body{ margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
        display:flex; align-items:center; justify-content:center;
        font-family:"Plus Jakarta Sans","Segoe UI",system-ui,Helvetica,sans-serif; }
  .card{ background:#fff; border:3px solid var(--ink); border-radius:20px;
         box-shadow:10px 10px 0 #cfe8f9; padding:56px 64px; max-width:640px; margin:24px; text-align:center }
  .mono{ font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace }
  h1{ font-size:2.4rem; letter-spacing:-0.02em; margin:.4em 0 .3em }
  p{ color:var(--soft); font-size:1.1rem; line-height:1.55; margin:.4em 0 }
  .kicker{ color:var(--muted); letter-spacing:.14em; text-transform:uppercase; font-size:.8rem }
  .dot{ display:inline-block; width:10px; height:10px; border-radius:50%; background:#d9481c;
        margin-right:8px; animation:blink 1.6s infinite }
  @keyframes blink{ 0%,100%{opacity:.25} 50%{opacity:1} }
</style>
</head>
<body>
  <div class="card">
    <div class="mono kicker">MOTIF · Motion from Imagined Footage</div>
    <h1>Under construction</h1>
    <p><span class="dot"></span>New worlds are being built and new takes are being measured
    right now.</p>
    <p>The full project page — results, clips, and the interactive 3D takes — will be back
    here shortly. Check back soon.</p>
  </div>
</body>
</html>
